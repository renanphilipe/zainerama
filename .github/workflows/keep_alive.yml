name: Keep Supabase Alive
on:
  schedule:
    # Executa todo dia à meia-noite (UTC) - mais que suficiente
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite executar manualmente pelo site do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/atualizar?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
